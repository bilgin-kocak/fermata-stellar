# Weekly update PRs, minor and patch versions grouped into one PR per ecosystem. Majors come alone,
# except for cargo.
#
# Not covered here: apps/attestor, whose dependencies follow TLSNotary's pin (tlsn by git rev,
# stellar-xdr at the version soroban-sdk uses), and the Stellar CLI and quickstart image that
# ci.yml pins by version and hash. Those move by hand, together.
version: 2
updates:
  # The actions in ci.yml are pinned by commit hash; Dependabot updates the hash and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The root workspace: contracts/escrow, contracts/session and crates/fermata-verdict. No majors:
  # the signing and hashing crates (ed25519-dalek, sha2, sha3, stellar-strkey) stay on the versions
  # soroban-sdk and the attestor use, so they move by hand together with soroban-sdk.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The pnpm workspace: packages/sdk, apps/gateway, apps/dashboard and apps/vendor.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
