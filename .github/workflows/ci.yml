name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # soroban-sdk 29 builds contracts only through `stellar contract build` (CLI 25.2 or newer).
  STELLAR_CLI_VERSION: "28.1.0"
  STELLAR_CLI_SHA256: "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462"
  # The local network the end-to-end job runs on: stellar-core 29.0.0, RPC 29.0.1 (2026-10-12).
  QUICKSTART_IMAGE: "stellar/quickstart@sha256:4f8dfd693deba57fddef7f0bc722e4782c2e606c8675e3adc5438cebae249295"

jobs:
  rust:
    name: fmt, clippy, tests, contract builds, wasm cost, TS client drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Rust toolchain from rust-toolchain.toml (with wasm32v1-none)
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf stellar-cli.tar.gz stellar
          sudo install -m 0755 stellar /usr/local/bin/stellar
          stellar --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (contracts and fermata-verdict, including randomized suites)
        run: cargo test --workspace

      - name: Build the contracts for wasm32v1-none
        run: |
          stellar contract build --package fermata-escrow
          stellar contract build --package fermata-session

      - name: What settle_batch costs, measured on the session wasm
        run: cargo test -p fermata-session cost -- --ignored --nocapture

      - name: The committed TypeScript clients match the contracts
        run: bash packages/sdk/scripts/bindings.sh --check

  attestor:
    name: attestor (Rust 1.95.0, TLSNotary), with real MPC-TLS sessions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/attestor
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Rust toolchain from apps/attestor/rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/attestor -> target

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --release

      # Five MPC-TLS proofs of the demo vendor through a notary process, one negative case per
      # binding check (needs node and openssl, both on the runner).
      - name: Integration test (real MPC sessions)
        run: cargo test --locked --release --test attest attestor_end_to_end -- --ignored --nocapture

      # Session calls proved for real: tickets checked before proving, DELIVERED and FAILED
      # entries, and the batch statement over them.
      - name: Integration test (session calls, real MPC sessions)
        run: cargo test --locked --release --test attest session_calls_end_to_end -- --ignored --nocapture

  sdk:
    name: TypeScript (SDK, gateway, dashboard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
      - name: pnpm (the version package.json pins, through corepack)
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
      - run: pnpm sdk:typecheck
      - run: pnpm sdk:test
      - run: pnpm gateway:typecheck
      - run: pnpm gateway:test
      - name: Dashboard (typecheck and build)
        run: pnpm dashboard:build

  e2e:
    name: end to end on a local Stellar network (deploy, M0, session, M1 and M2 cases)
    runs-on: ubuntu-24.04
    env:
      NETWORK: local
      LOCAL_PASSPHRASE: "Test SDF Network ; September 2015"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # With testnet's passphrase, so that Stellar's MPP Charge and x402 `exact`, which know only the
      # testnet and mainnet passphrases, run against it unmodified. The keys are made for this run.
      - name: Start the local network (protocol 29, testnet's passphrase)
        run: |
          docker run -d --name stellar --network host -e NETWORK_PASSPHRASE="$LOCAL_PASSPHRASE" \
            "$QUICKSTART_IMAGE" --local --enable core,rpc,horizon --protocol-version 29

      - name: Rust toolchains (root and attestor)
        run: |
          rustup toolchain install
          (cd apps/attestor && rustup toolchain install)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/attestor -> target

      - name: Stellar CLI ${{ env.STELLAR_CLI_VERSION }}
        run: |
          curl -sSfL -o stellar-cli.tar.gz \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_CLI_SHA256}  stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf stellar-cli.tar.gz stellar
          sudo install -m 0755 stellar /usr/local/bin/stellar
          stellar --version

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Build the contracts, fermata-verdict and the attestor
        run: |
          stellar contract build --package fermata-escrow
          stellar contract build --package fermata-session
          cargo build --locked --release -p fermata-verdict
          (cd apps/attestor && cargo build --locked --release)

      - name: Wait for RPC and Friendbot
        run: |
          for _ in $(seq 120); do
            curl -s -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' http://localhost:8000/rpc |
              grep -q '"healthy"' && break
            sleep 2
          done
          for _ in $(seq 120); do
            curl -sf "http://localhost:8000/friendbot?addr=GAJLQLBMTOP4SDCS4KMJTMN35T3RRKKHRVYTMYFVBMNHNYFJ5FETXJ2B" >/dev/null && break
            sleep 2
          done

      - name: Deploy the escrow, the session contract and the demo service
        run: scripts/deploy-testnet.sh

      - name: M0 cases (verdicts signed by the script)
        run: scripts/demo-cases.sh

      # The largest batch the contract takes, simulated on this network: its CPU, fee and size.
      - name: Session cases (statements signed by the script)
        run: COST_CALLS=1000 scripts/session-cases.sh

      - name: M1 cases (real TLSNotary proofs through the attestor)
        run: scripts/attest-cases.sh

      - name: Workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      # The live suites: the escrow's views, holds through a relayer and through a stand-in Channels
      # service, the MPP method and the x402 scheme end to end, the indexer with reconciliation, and
      # sessions opened (sponsored and not) and settled with batches the SDK signs.
      - name: The SDK's live tests against the deployment
        run: |
          FERMATA_AGENT_SECRET="$(stellar keys secret fermata-agent)" \
          FERMATA_RELAYER_SECRET="$(stellar keys secret fermata-relayer)" \
          FERMATA_VERIFIER_SECRET="$(stellar keys secret fermata-verifier)" \
          FERMATA_DEPLOYMENT=deployments/local.json pnpm sdk:test

      - name: M2 cases (an agent pays through the gateway with MPP and x402; every outcome reconciled)
        run: scripts/gateway-cases.sh

  vectors:
    name: golden vectors, independent Python/OpenSSL check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # The runner's own Python 3 (3.12 on ubuntu-24.04), in a venv because the system
      # interpreter is externally managed (PEP 668).
      - name: Check the vectors with Python and OpenSSL
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "cryptography>=42"
          "$RUNNER_TEMP/venv/bin/python" --version
          "$RUNNER_TEMP/venv/bin/python" test-vectors/check_vectors.py

  scripts:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: shellcheck --version && shellcheck -x scripts/*.sh packages/sdk/scripts/*.sh
