[package]
name = "fermata-escrow"
description = "Fermata on Stellar: pay-on-proof escrow for machine payments (Soroban port of FermataEscrow.sol)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# `hazmat-address` exposes `Address::to_payload`, used only to read this contract's own 32-byte id
# for the verdict's domain separation (never to authenticate anyone).
soroban-sdk = { workspace = true, features = ["hazmat-address"] }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "hazmat-address"] }
ed25519-dalek.workspace = true
fermata-verdict.workspace = true
hex.workspace = true
proptest.workspace = true
serde_json.workspace = true
