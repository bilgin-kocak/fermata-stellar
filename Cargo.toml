[workspace]
resolver = "2"
members = ["contracts/escrow", "crates/fermata-verdict"]
# The attestor is its own workspace (Rust 1.95.0, TLSNotary); see apps/attestor/Cargo.toml.
exclude = ["apps/attestor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/bilgin-kocak/fermata-stellar"
rust-version = "1.91"

[workspace.dependencies]
soroban-sdk = "29.0.1"
ed25519-dalek = "2.2"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-strkey = "0.0.16"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
proptest = "1"
fermata-verdict = { path = "crates/fermata-verdict" }

# Release profile for the contract Wasm (the settings `stellar contract init` generates).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Tests run the Soroban host natively. Optimizing dependencies (not the workspace crates) makes
# the randomized suites several times faster.
[profile.dev.package."*"]
opt-level = 3
